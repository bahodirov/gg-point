version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ggpoint-db
    environment:
      POSTGRES_DB: ggpoint
      POSTGRES_USER: ggpoint_user
      POSTGRES_PASSWORD: dilshod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggpoint_user -d ggpoint"]
      interval: 10s
      timeout: 5s
      retries: 5

  ggpoint:
    build: .
    container_name: ggpoint-app
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  uploads_data:
